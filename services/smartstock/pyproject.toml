[project]
name = "smartstock"
version = "2.2.1"
description = "Inventory optimisation engine: continuous (s,S) under stochastic lead times"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]
# NOTE: `cma` is deliberately NOT a dependency. CMA-ES is implemented in
# smartstock/optim/cmaes.py (pure NumPy) so the service has no optimiser
# dependency and can be deployed into air-gapped environments.

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.26", "ruff>=0.3", "mypy>=1.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
