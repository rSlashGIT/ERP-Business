<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apparel ERP</title>
<style>
:root{
 --ink:#191A2E;--ink2:#3F4157;--ink3:#6E7085;--ink4:#9B9DB0;
 --line:#E7E3DC;--line2:#F4F1EC;--bg:#FAF8F5;--card:#FFFFFF;
 --brand:#1B1C3A;--brand2:#4338CA;--soft:#EEEBFF;--brandL:#DDD8FB;
 --accent:#C2410C;--accentS:#FFF4ED;
 --ok:#0F766E;--okS:#EFFCF8;--warn:#B45309;--warnS:#FFFBEB;
 --bad:#B91C1C;--badS:#FEF2F2;--purple:#6D28D9;--purpleS:#F5F3FF;
 --r:11px;--sh:0 1px 2px rgba(11,18,32,.04),0 2px 6px rgba(11,18,32,.05);
 --shL:0 18px 50px rgba(11,18,32,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* 14.5px base, not 13.5. This gets used at a shop counter, often by someone
   over forty, frequently on a cheap laptop at 1366x768. Small type reads as
   "complicated software" before a single word is understood. */
body{font:14.5px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
#app{display:flex;height:100vh;overflow:hidden}

/* sidebar */
#side{width:232px;flex:0 0 232px;background:linear-gradient(168deg,#262750 0%,#1B1C3A 58%,#141530 100%);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:17px 17px 15px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .n{color:#fff;font-weight:700;font-size:16px;letter-spacing:-.3px}
.brand .s{color:#8FA6CC;font-size:11px;margin-top:2px}
nav{padding:9px 8px 18px;flex:1}
.grp{color:rgba(255,255,255,.34);font-size:9.5px;font-weight:700;letter-spacing:.9px;
 text-transform:uppercase;padding:11px 9px 5px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;
 border-radius:9px;color:rgba(255,255,255,.80);font-size:13.6px;transition:.13s}
.nav:hover{background:rgba(255,255,255,.09);color:#fff}
.nav.on{background:#fff;color:var(--brand);font-weight:680;box-shadow:0 3px 12px rgba(0,0,0,.22)}
.nav.on svg{color:var(--brand2)}
.nav .b{margin-left:auto;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;
 padding:1px 5px;border-radius:9px;min-width:16px;text-align:center}
.nav svg{width:16.5px;height:16.5px;flex:0 0 auto}

/* main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#top{height:60px;flex:0 0 60px;background:var(--card);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:12px;padding:0 18px}
#top h1{font-size:17.5px;font-weight:680;letter-spacing:-.35px;color:var(--brand)}
#top .sub{font-size:12.5px;color:var(--ink3);margin-top:-1px}
.spacer{flex:1}
#tsw{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--brandL);
 border-radius:8px;padding:5px 9px}
#tsw label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--brand2)}
#tsw select{border:none;background:none;font-size:12.5px;font-weight:650;color:var(--brand);cursor:pointer;outline:none}
#body{flex:1;overflow-y:auto;padding:18px}
.page{display:none;max-width:1500px}.page.on{display:block;animation:f .16s ease}
@keyframes f{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* atoms */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;
 font-size:12.5px;font-weight:550;border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.12s}
.btn:hover{border-color:var(--ink4);background:var(--bg)}
.btn.p{background:var(--brand2);color:#fff;border-color:var(--brand2);box-shadow:0 2px 8px rgba(36,86,230,.28);font-weight:650}
.btn.p:hover{background:#1B45C9;border-color:#1B45C9}
.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.d{background:var(--badS);color:var(--bad);border-color:#FECACA}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
 font-size:12.5px;outline:none;transition:.12s}
.inp:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--soft)}
select.inp{cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh)}
.ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ct{letter-spacing:-.2px;font-size:13px;font-weight:650}.cs{font-size:11px;color:var(--ink3)}
.cb{padding:16px}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1200px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;box-shadow:var(--sh);transition:.15s}
.kpi:hover{box-shadow:0 4px 16px rgba(11,18,32,.09)}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-size:27px;font-weight:720;letter-spacing:-1px;margin-top:6px;line-height:1.1}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 11px;font-size:11px;font-weight:700;letter-spacing:.5px;
 text-transform:uppercase;color:var(--ink3);background:var(--bg);border-bottom:1px solid var(--line);
 white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:11px 11px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:none}
.r{text-align:right}.c{text-align:center}
.tw{overflow:auto;max-height:calc(100vh - 260px)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;
 font-size:10px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;white-space:nowrap}
.p-ok{background:var(--okS);color:var(--ok)}.p-warn{background:var(--warnS);color:var(--warn)}
.p-bad{background:var(--badS);color:var(--bad)}.p-info{background:var(--soft);color:var(--brand2)}
.p-grey{background:var(--line2);color:var(--ink3)}.p-pur{background:var(--purpleS);color:var(--purple)}
.bar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mini{font-size:12px;color:var(--ink3)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px}
.empty{padding:46px 20px;text-align:center;color:var(--ink3)}
.empty h4{font-size:14px;color:var(--ink2);margin-bottom:5px}
.ov{position:fixed;inset:0;background:rgba(11,18,32,.5);z-index:100;display:none;
 align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shL);width:100%;max-width:640px;margin:auto 0;
 animation:pop .17s cubic-bezier(.2,.9,.3,1.1)}
.modal.w{max-width:940px}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mb{padding:18px;max-height:calc(100vh - 220px);overflow-y:auto}
.mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:0 0 12px 12px}
#toast{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:12.5px;
 box-shadow:var(--shL);animation:sl .2s;max-width:420px}
.tst.ok{background:var(--ok)}.tst.bad{background:var(--bad)}
@keyframes sl{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow-x:auto}
.tab{padding:9px 14px;font-size:12.5px;color:var(--ink3);border-bottom:2px solid transparent;
 margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}
.spark{display:flex;align-items:flex-end;gap:3px;height:64px}
.spark div{flex:1;background:var(--brand2);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.matrix td,.matrix th{border:1px solid var(--line);text-align:center;padding:7px 9px}
.matrix .z{background:var(--badS);color:var(--bad);font-weight:600}
.matrix .lo{background:var(--warnS);color:var(--warn);font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:650;color:var(--ink2);margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* billing */
.billwrap{display:grid;grid-template-columns:1fr 372px;gap:14px;align-items:start}
@media(max-width:1100px){.billwrap{grid-template-columns:1fr}}
.res{max-height:290px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:7px}
.res .it{padding:9px 11px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:10px;align-items:center}
.res .it:hover{background:var(--soft)}
.res .it:last-child{border-bottom:none}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px}
.tot.big{font-size:19px;font-weight:700;padding-top:9px;border-top:2px solid var(--line);margin-top:6px}
@media print{#side,#top,.bar,.mf,#toast{display:none!important}
 #body{padding:0;overflow:visible}.ov{position:static;background:none;padding:0;display:block}
 .modal{box-shadow:none;max-width:100%}.noprint{display:none!important}}
.inv-print{font-size:11.5px}
.inv-print table{font-size:11px}
.inv-print th,.inv-print td{border:1px solid #bbb;padding:11px 7px}

/* ── skeleton loading: shimmer that matches the shape of what is coming ── */
.sk{background:linear-gradient(90deg,var(--line2) 25%,#ECE8E1 37%,var(--line2) 63%);
 background-size:400% 100%;border-radius:6px;animation:shim 1.4s ease infinite}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ── page + row entrances: fast enough to feel responsive, not decorative ── */
.page.on{animation:pg .22s cubic-bezier(.2,.7,.3,1)}
@keyframes pg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--line2)}
.card{transition:box-shadow .16s,border-color .16s}
.kpi .v{transition:color .2s}

/* ── the counter that ticks up when a number lands ── */
@keyframes pop{0%{transform:scale(.94);opacity:.55}100%{transform:none;opacity:1}}
.kpi.fresh .v{animation:pop .3s cubic-bezier(.2,.8,.3,1)}

/* ── dashboard chart ── */
.chart{width:100%;height:170px;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{font-size:10px;fill:var(--ink3)}
.bar-r{transition:opacity .15s}
.bar-r:hover{opacity:.75}

/* ── empty states: an invitation, not an apology ── */
.empty{text-align:center;padding:38px 20px}
.empty h4{font-size:15.5px;font-weight:650;margin-bottom:5px}
.empty p{max-width:420px;margin:0 auto}

/* ── sidebar identity: a thin accent rail on the active item ── */
.nav{position:relative}
.nav.on::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;
 border-radius:0 3px 3px 0;background:var(--accent)}

/* ── focus that is visible without being loud ── */
.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--brand2);
 box-shadow:0 0 0 3px var(--soft)}
.btn:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
</style></head><body>
<div id="app">
 <aside id="side">
  <div class="brand"><div class="n" id="bizName">—</div><div class="s" id="bizGst">—</div></div>
  <nav id="nav"></nav>
 </aside>
 <div id="main">
  <header id="top">
   <div><h1 id="ptitle">Dashboard</h1><div class="sub" id="psub"></div></div>
   <div class="spacer"></div>
   <div id="tsw"><label>Business</label><select id="tenantSel" onchange="switchTenant(this.value)"></select></div>
   <button class="btn p" onclick="go('billing')">＋ New Bill</button>
  </header>
  <div id="body">
   <div class="page on" id="p-dashboard"></div><div class="page" id="p-billing"></div>
   <div class="page" id="p-invoices"></div><div class="page" id="p-customers"></div>
   <div class="page" id="p-receivables"></div><div class="page" id="p-inventory"></div>
   <div class="page" id="p-styles"></div><div class="page" id="p-purchase"></div>
   <div class="page" id="p-reports"></div><div class="page" id="p-import"></div><div class="page" id="p-prices"></div><div class="page" id="p-receiving"></div>
   <div class="page" id="p-returns"></div><div class="page" id="p-payables"></div>
   <div class="page" id="p-tax"></div><div class="page" id="p-stocktakes"></div><div class="page" id="p-transfers"></div>
  </div>
 </div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)closeM()">
 <div class="modal" id="modal"><div class="mh"><div><div class="ct" id="mt"></div><div class="cs" id="ms"></div></div>
 <div class="spacer"></div><button class="btn sm noprint" onclick="closeM()">✕</button></div>
 <div class="mb" id="mb"></div><div class="mf noprint" id="mf"></div></div></div>
<div id="toast"></div>
<script>
const API=location.origin;
let TENANT=localStorage.getItem("erp_tenant")||"kurta-house";
let TENANTS=[],PAGE="dashboard",CACHE={};

const money=n=>"₹"+(Math.round(n||0)).toLocaleString("en-IN");
const money2=n=>"₹"+(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const compact=n=>{n=n||0;const a=Math.abs(n);
 return a>=1e7?"₹"+(n/1e7).toFixed(2)+" Cr":a>=1e5?"₹"+(n/1e5).toFixed(2)+" L":
        a>=1e3?"₹"+(n/1e3).toFixed(1)+"K":"₹"+Math.round(n)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=s=>s?new Date(String(s).slice(0,10)+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"}):"—";
/* Quantities are pieces. 14 not 14.0, 2.5 not 2.500000000000001. */
const fmt=n=>{n=+n||0;return Number.isInteger(n)?n.toLocaleString("en-IN"):n.toFixed(1)};
/* A screen that is fetching should look like the screen it is about to be,
   not like a blank page or a spinner — the layout must not jump. */
const skeleton=(rows=3)=>`<div class="grid g3" style="margin-bottom:14px">
  ${[0,1,2].map(()=>`<div class="kpi"><div class="sk" style="width:52%;height:10px"></div>
   <div class="sk" style="width:38%;height:22px;margin-top:9px"></div>
   <div class="sk" style="width:64%;height:10px;margin-top:7px"></div></div>`).join("")}
 </div><div class="card"><div class="cb">
  ${Array.from({length:rows},()=>`<div class="sk" style="height:15px;margin-bottom:11px"></div>`).join("")}
 </div></div>`;
const emptyState=(title,body,action="")=>`<div class="cb"><div class="empty">
  <h4>${esc(title)}</h4><p class="mini">${esc(body)}</p>${action}</div></div>`;
const num=n=>(Math.round(n||0)).toLocaleString("en-IN");

async function api(path,opts){
 const r=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json","X-Tenant":TENANT,...(opts?.headers||{})}});
 if(!r.ok){let d=r.statusText;try{const b=await r.json();d=b.error||b.detail||d}catch{}throw new Error(d)}
 return r.json();
}
function toast(m,k=""){const d=document.createElement("div");d.className="tst "+k;d.textContent=m;
 document.getElementById("toast").appendChild(d);
 setTimeout(()=>{d.style.opacity=0;d.style.transition="opacity .3s";setTimeout(()=>d.remove(),300)},3000)}
function openM(t,s,b,f,cls=""){document.getElementById("mt").textContent=t;
 document.getElementById("ms").textContent=s||"";document.getElementById("mb").innerHTML=b;
 document.getElementById("mf").innerHTML=f||"";document.getElementById("modal").className="modal "+cls;
 document.getElementById("ov").classList.add("on")}
const closeM=()=>document.getElementById("ov").classList.remove("on");

const IC={dash:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
 bill:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
 doc:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>',
 user:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>',
 cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 box:'<path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
 grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
 cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/>',
 chart:'<path d="M18 20V10M12 20V4M6 20v-6"/>',
 up:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 tag:'<path d="M20.6 13.4L12 22l-9-9V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
 truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/>',
 undo:'<path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 102.1-9.4L3 7"/>',
 wallet:'<path d="M21 12V7H5a2 2 0 010-4h14v4"/><path d="M3 5v14a2 2 0 002 2h16v-5"/><path d="M18 12a1 1 0 100 4 1 1 0 000-4z"/>'};
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const NAV=[["",[["dashboard","Dashboard",IC.dash]]],
 ["Sell",[["billing","Billing",IC.bill],["invoices","Invoices",IC.doc],
   ["customers","Customers",IC.user],["receivables","Receivables",IC.cash],["returns","Returns",IC.undo]]],
 ["Stock",[["inventory","Inventory",IC.box],["styles","Styles & Variants",IC.grid],
   ["stocktakes","Stocktakes",IC.doc],["transfers","Stock Transfers",IC.truck],
   ["import","Bring in your stock",IC.up]]],
 ["Buy",[["purchase","Reorder & POs",IC.cart],["receiving","Receive stock",IC.truck],["payables","Payables",IC.wallet]]],
 ["Insight",[["prices","Price Advisor",IC.tag],["tax","Tax & Compliance",IC.doc],["reports","Reports",IC.chart]]]];
const TITLES={dashboard:["Dashboard","Your business at a glance"],
 billing:["Billing","Scan or search, bill in seconds - GST calculated live"],
 invoices:["Invoices","Every tax invoice raised"],customers:["Customers","Who buys from you, and what they owe"],
 receivables:["Receivables","Money owed to you, oldest first"],
 inventory:["Inventory","Stock by size and colour"],styles:["Styles & Variants","Your catalogue, size x colour"],
 stocktakes:["Stocktakes","Physical counts and discrepancy adjustments"],
 transfers:["Stock Transfers","Move inventory between locations"],
 purchase:["Reorder & Purchase Orders","AI suggests, you decide"],reports:["Reports","What sells, what doesn't"],
 import:["Bring in your stock","Paste your existing list - we read it, you check it, then it's in"],
 tax:["Tax & Compliance","GSTR-1 and GSTR-3B working papers, month by month"],
 prices:["Price Advisor","What each style should sell for, from your own sales"],
 receiving:["Receive stock","Book in what the supplier delivered"],
 returns:["Returns & credit notes","Take a garment back, restock it or write it off"],
 payables:["Payables","What you owe suppliers, oldest first"]};

function buildNav(){document.getElementById("nav").innerHTML=NAV.map(([g,items])=>
 `<div>${g?`<div class="grp">${g}</div>`:""}${items.map(([id,t,ic])=>
 `<button class="nav" data-p="${id}" onclick="go('${id}')">${sv(ic)}<span>${t}</span><span id="bdg-${id}"></span></button>`).join("")}</div>`).join("")}

/* A real chart, drawn as SVG with a viewBox so it scales to the card rather
   than to a fixed pixel width. Bars carry a <title> so hovering gives the
   actual day and figure — a chart you cannot read a value off is decoration. */
function trendChart(trend){
 if(!trend||!trend.length)
   return `<div class="mini" style="padding:26px 0;text-align:center">No sales in the last 30 days.</div>`;
 const W=560,H=150,pad=26,max=Math.max(...trend.map(x=>x.v),1);
 const bw=(W-pad)/trend.length, gap=Math.min(3,bw*0.22);
 const ticks=[0,.5,1].map(f=>({y:H-f*(H-14),v:max*f}));
 return `<svg class="chart" viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none"
   role="img" aria-label="Daily sales for the last ${trend.length} days">
  ${ticks.map(t=>`<line class="grid-l" x1="${pad}" y1="${t.y.toFixed(1)}" x2="${W}" y2="${t.y.toFixed(1)}"/>
    <text class="axis" x="0" y="${(t.y+3).toFixed(1)}">${compact(t.v)}</text>`).join("")}
  ${trend.map((x,i)=>{
    const h=Math.max(2,(x.v/max)*(H-16));
    return `<rect class="bar-r" x="${(pad+i*bw+gap/2).toFixed(1)}" y="${(H-h).toFixed(1)}"
      width="${Math.max(1,bw-gap).toFixed(1)}" height="${h.toFixed(1)}" rx="2"
      fill="${x.v>=max*0.999?"var(--accent)":"var(--brand2)"}"
      ><title>${esc(x.d)}: ${money(x.v)}</title></rect>`;}).join("")}
  <text class="axis" x="${pad}" y="${H+15}">${esc(trend[0].d)}</text>
  <text class="axis" x="${W}" y="${H+15}" text-anchor="end">${esc(trend[trend.length-1].d)}</text>
 </svg>`;
}

}

function drawTotals(){
 const cust=CACHE.customers.find(c=>c.id===BILL.customer);
 const seller=(TENANTS.find(t=>t.id===TENANT)||{}).state_code;
 const inter=cust&&cust.state_code&&seller&&cust.state_code!==seller;
 let taxable=0,tax=0,byRate={};
 BILL.lines.forEach(l=>{
  const tv=+(l.quantity*l.unit_price*(1-l.discount_pct/100)).toFixed(2);
  const per=l.quantity?tv/l.quantity:0;
  const apparel=["61","62","63","64"].includes((l.hsn_code||"").slice(0,2));
  const rate=apparel?(per<=2500?5:18):18;
  const t=+(tv*rate/100).toFixed(2);
  taxable+=tv;tax+=t;byRate[rate]=(byRate[rate]||0)+t;});
 const exact=taxable+tax,grand=Math.round(exact),round=+(grand-exact).toFixed(2);
 document.getElementById("btot").innerHTML=`
  <div class="tot"><span class="mini">Taxable value</span><span class="num">${money2(taxable)}</span></div>
  ${Object.entries(byRate).sort().map(([r,v])=>inter
    ?`<div class="tot"><span class="mini">IGST @ ${r}%</span><span class="num">${money2(v)}</span></div>`
    :`<div class="tot"><span class="mini">CGST @ ${r/2}%</span><span class="num">${money2(v/2)}</span></div>
      <div class="tot"><span class="mini">SGST @ ${r/2}%</span><span class="num">${money2(v/2)}</span></div>`).join("")}
  ${round?`<div class="tot"><span class="mini">Round off</span><span class="num">${money2(round)}</span></div>`:""}
  <div class="tot big"><span>Total</span><span class="num">${money(grand)}</span></div>
  ${Object.keys(byRate).length>1?`<div class="mini" style="margin-top:7px;padding:7px 9px;background:var(--soft);border-radius:7px">
    This bill spans two GST slabs — garments up to ₹2,500 a piece are 5%, above that 18%.</div>`:""}
  ${inter?`<div class="mini" style="margin-top:6px"><span class="pill p-pur">Inter-state</span> IGST applies</div>`:""}`;
}

function setPick(id,v){PICK[id]={...(PICK[id]||{action:"approve"}),qty:+v||0};
 const r=CACHE.reco.find(x=>x.id===id);if(r&&+v!==r.recommended_qty)PICK[id].action="modify";updateCommit()}
function setPickAction(id,a){PICK[id]=PICK[id]?.action===a?undefined:{...(PICK[id]||{}),action:a,
  qty:PICK[id]?.qty??CACHE.reco.find(x=>x.id===id)?.recommended_qty};renderPurchase()}
function bulkPick(a){PICK={};if(a)CACHE.reco.forEach(r=>PICK[r.id]={action:a,qty:r.recommended_qty});renderPurchase()}
function updateCommit(){const n=Object.values(PICK).filter(Boolean).length;
 const b=document.getElementById("commitBtn");if(b){b.textContent=`Commit ${n} decision${n==1?"":"s"}`;b.disabled=!n}}
async function commitPicks(){
 const dec=Object.entries(PICK).filter(([,v])=>v).map(([id,v])=>({id,action:v.action,final_qty:v.qty}));
 if(!dec.length)return;
 try{const r=await api("/api/v1/procurement/recommendations/decide",{method:"POST",

  PICK={};CACHE={};toast(`${r.approved+r.modified} approved · POs ${r.purchase_orders_created.join(", ")||"none"}`,"ok");
  renderPurchase()}catch(e){toast(e.message,"bad")}}

 <div class="card"><div class="cb" style="padding-bottom:2px">

function deadZoneBar(dz){
 /* A tag inside the shaded band is strictly worse than the band's left edge. */
 const lo=2000,hi=3600,pos=v=>((v-lo)/(hi-lo)*100).toFixed(1);
 const marks=(PRICES?.items||[]).filter(d=>d.current_shelf>lo&&d.current_shelf<hi);
 return `<div style="position:relative;height:74px;margin-top:6px">
  <div style="position:absolute;left:0;right:0;top:26px;height:12px;border-radius:6px;
   background:linear-gradient(90deg,var(--okS),var(--okS));border:1px solid var(--line)"></div>
  <div style="position:absolute;top:26px;height:12px;border-radius:0;
   left:${pos(dz.low)}%;width:${pos(dz.high)-pos(dz.low)}%;
   background:repeating-linear-gradient(45deg,var(--badS),var(--badS) 5px,#fff 5px,#fff 10px);
   border:1px solid var(--bad)"></div>
  ${[[dz.low,"₹2,625 · 5% tax","var(--ok)"],[dz.high,"₹2,950 · 18% tax","var(--bad)"]].map(([v,t,c])=>
   `<div style="position:absolute;left:${pos(v)}%;top:14px;width:1px;height:36px;background:${c}"></div>
    <div style="position:absolute;left:${pos(v)}%;top:52px;transform:translateX(-50%);
     font-size:10px;font-weight:700;color:${c};white-space:nowrap">${t}</div>`).join("")}
  ${marks.map(d=>`<div title="${esc(d.style_name)}" style="position:absolute;left:${pos(d.current_shelf)}%;
    top:4px;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap;
    color:${d.cliff?"var(--bad)":"var(--ink2)"}">▼ ${esc(d.style_name.split(" ")[0])}</div>`).join("")}
  <div style="position:absolute;left:0;top:52px;font-size:10px;color:var(--ink3)">₹2,000</div>
  <div style="position:absolute;right:0;top:52px;font-size:10px;color:var(--ink3)">₹3,600</div>
 </div>`;
}

async function priceDetail(id){
 const d=await api("/api/v1/prices/"+id);
 const c=d.curve,maxP=Math.max(...c.map(p=>p.profit),1);
 const w=560,h=150;
 const x=i=>(i/(c.length-1))*w, y=p=>h-(p.profit/maxP)*(h-14);
 const path=c.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join("");
 const bi=c.findIndex(p=>p.taxable===d.best.taxable);
 const ci=c.reduce((a,p,i)=>Math.abs(p.taxable-d.current_taxable)<Math.abs(c[a].taxable-d.current_taxable)?i:a,0);
 const cliffI=c.findIndex(p=>p.is_cliff_edge);
 openM(`Price advisor — ${esc(d.style_name)}`,
  `${esc(d.style_code)} · ${d.elasticity.n_points} price points · ${d.elasticity.confidence} confidence`,
  `
  <div class="mini" style="padding:11px 13px;background:var(--soft);border-radius:9px;line-height:1.6;margin-bottom:14px">
   <b>${esc(d.headline)}</b></div>
  ${d.cliff_note?`<div class="mini" style="padding:11px 13px;background:var(--badS);color:var(--bad);
    border-radius:9px;line-height:1.6;margin-bottom:14px">${esc(d.cliff_note)}</div>`:""}
  <div class="grid g4" style="margin-bottom:14px">
   ${[["Cost to you",money(d.cost)],["Tag now",money(d.current_shelf)],
      ["Suggested",money(d.best.shelf)],["In stock",d.on_hand.toFixed(0)+" pcs"]]
    .map(([l,v])=>`<div class="kpi" style="padding:9px 11px"><div class="l">${l}</div>
     <div class="v num" style="font-size:17px">${v}</div></div>`).join("")}
  </div>
  <div class="ct" style="margin-bottom:2px">Profit at each price</div>
  <div class="mini" style="margin-bottom:8px">Built from ${d.elasticity.n_points} prices this
   style has actually sold at. A 10% cut moves about
   <b>${d.elasticity.volume_gain_per_10pct_cut}% more pieces</b>.</div>
  <svg viewBox="0 0 ${w} ${h+22}" style="width:100%;height:172px">
   ${cliffI>=0?`<line x1="${x(cliffI)}" y1="0" x2="${x(cliffI)}" y2="${h}" stroke="var(--bad)"
     stroke-width="1" stroke-dasharray="3 3"/>
     <text x="${x(cliffI)+4}" y="11" font-size="9" fill="var(--bad)">₹2,500 GST line</text>`:""}
   <path d="${path}" fill="none" stroke="var(--brand2)" stroke-width="2"/>
   <circle cx="${x(ci)}" cy="${y(c[ci])}" r="4" fill="var(--ink3)"/>
   <text x="${x(ci)}" y="${h+14}" font-size="9" fill="var(--ink3)" text-anchor="middle">now</text>
   <circle cx="${x(bi)}" cy="${y(c[bi])}" r="5" fill="var(--ok)"/>
   <text x="${x(bi)}" y="${h+14}" font-size="9" fill="var(--ok)" text-anchor="middle"
     font-weight="700">best</text>
  </svg>
  <div class="mini" style="margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:8px;line-height:1.6">
   <b>Clearing the stock:</b> ${esc(d.markdown.reason)}</div>`,
  `<button class="btn" onclick="closeM()">Leave it</button>
   <span class="spacer"></span>
   ${d.markdown.urgency!="none"&&Math.round(d.markdown.recommended_taxable)!=Math.round(d.best.taxable)?
     `<button class="btn" onclick="applyPrice('${d.style_id}',${d.markdown.recommended_taxable})">
       Markdown to ${money(d.markdown.recommended_shelf)}</button>`:""}
   <button class="btn p" onclick="applyPrice('${d.style_id}',${d.best.taxable})">
    Set the tag to ${money(d.best.shelf)}</button>`);
}

async function doReceive(poId,rows){
 const lines=rows.map((r,i)=>({po_line_id:r.id,product_id:r.p,
   accepted_qty:+(document.getElementById("acc"+i)?.value||0),
   rejected_qty:+(document.getElementById("rej"+i)?.value||0),
   unit_cost:+(document.getElementById("cst"+i)?.value||0)}))
  .filter(l=>l.accepted_qty>0||l.rejected_qty>0);
 if(!lines.length)return toast("Enter what arrived first","bad");
 try{
  const r=await api("/api/v1/receiving/receive",{method:"POST",body:JSON.stringify({
    purchase_order_id:poId,lines,
    supplier_invoice:document.getElementById("grnInv")?.value||"",
    notes:document.getElementById("grnNote")?.value||""})});
  closeM();
  toast(`${r.grn_number}: ${fmt(r.accepted)} pieces in, ${money(r.total_value)}`+
        (r.rejected?`, ${fmt(r.rejected)} rejected`:""),"ok");
  CACHE={};renderReceiving();
 }catch(e){toast(e.message,"bad")}
}

function downloadTax(which){
 // Same reasoning as the label sheet: the tenant travels in the header, never
 // the URL, so the CSV is fetched and handed to an object URL rather than
 // linked to directly.
 const month=TAXMONTH;
 if(!month)return toast("Pick a month first","bad");
 const label=which==="gstr1"?"GSTR-1":"GSTR-3B";
 fetch(`${API}/api/v1/tax/${which}.csv?month=${encodeURIComponent(month)}`,
       {headers:{"X-Tenant":TENANT}})
  .then(r=>{if(!r.ok)throw new Error(`${label} could not be built`);return r.blob()})
  .then(b=>{
   const url=URL.createObjectURL(b);
   const a=document.createElement("a");
   a.href=url;a.download=`${label}-${month}.csv`;
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1500);
   toast(`${label} for ${month} downloaded`,"ok");
  })
  .catch(e=>toast(e.message,"bad"));
}

async function openLabelSheet(ids){
 const sheet=document.getElementById("lblSheet")?.value||"l7159";
 const copies=Math.max(1,+(document.getElementById("lblCopies")?.value||1));
 // The tenant NEVER travels in the URL. `window.open` on the route directly
 // would send no X-Tenant header, so the server would fall back to the default
 // business and cheerfully print the wrong shop's tags — or an empty sheet.
 // Passing the tenant as a query parameter would "fix" that by breaking the
 // one rule this codebase does not bend: no request value ever selects a
 // tenant. So the page is FETCHED with the header like every other call and
 // written into the tab. The window is opened first, synchronously, because a
 // pop-up opened after an await is blocked by default.
 const w=window.open("","_blank");
 if(!w){toast("Your browser blocked the pop-up — allow pop-ups for this page","bad");return}
 w.document.write("<!DOCTYPE html><title>Preparing labels…</title>"+
   "<body style='font:14px system-ui;padding:32px;color:#444'>Preparing labels…");
 try{
  const url=`${API}/api/v1/labels/print?product_ids=${encodeURIComponent(ids.join(","))}`
    +`&sheet=${encodeURIComponent(sheet)}&copies=${copies}`;
  const res=await fetch(url,{headers:{"X-Tenant":TENANT}});
  if(!res.ok)throw new Error("could not build the label sheet");
  const html=await res.text();
  w.document.open();w.document.write(html);w.document.close();
  closeM();
 }catch(e){ w.close(); toast(e.message,"bad"); }
}

    <td class="r num">${fmt(r.on_hand)}</td>
    <td class="r"><input class="inp num r" style="width:84px" type="number" min="0" step="1"
      id="stq${i}" value="${r.on_hand}"></td>
   </tr>`).join("")}
  </tbody></table></div>
  <div class="field" style="margin-top:12px"><label>Notes</label>
   <input class="inp" id="stNote" placeholder="e.g. quarterly count, back rack"></div>`,
  `<button class="btn" onclick="closeM()">Cancel</button><span class="spacer"></span>
   <button class="btn p" onclick='doStocktake(${JSON.stringify(rows.map(r=>({p:r.product_id,e:r.on_hand})))})'>
     Post the count</button>`);
}

async function doStocktake(rows){
 const lines=rows.map((r,i)=>({product_id:r.p,
   counted_qty:+(document.getElementById("stq"+i)?.value ?? r.e)}));
 const changed=lines.filter((l,i)=>l.counted_qty!==rows[i].e);
 if(!changed.length)return toast("Nothing differs from the books — nothing to adjust","bad");
 try{
  const r=await api("/api/v1/inventory/stocktakes",{method:"POST",body:JSON.stringify({
    location_id:document.getElementById("stLoc")?.value,
    lines,notes:document.getElementById("stNote")?.value||""})});
  closeM();
  toast(`${r.stocktake_number}: ${r.lines_adjusted} line${r.lines_adjusted==1?"":"s"} adjusted, `+
        `net ${r.total_variance>0?"+":""}${fmt(r.total_variance)}`,"ok");
  CACHE={};renderStocktakes();
 }catch(e){toast(e.message,"bad")}
}

/* ───────── stock transfers ─────────
   Warehouse to shop floor. Both sides move in one transaction and both get a
   ledger row, so the total never changes — only where it sits. */
async function renderTransfers(){
 const host=document.getElementById("p-transfers");
 host.innerHTML=skeleton(3);
 let d;
 try{ d=await api("/api/v1/inventory/transfers"); }
 catch(e){ host.innerHTML=errorCard("We could not load your transfers",e.message,"renderTransfers()"); return; }
 const items=d.items||[];
 host.innerHTML=`
 <div class="grid g3" style="margin-bottom:14px">
  ${[["Transfers",items.length,"","between your locations"],
     ["Pieces moved",fmt(items.reduce((a,x)=>a+(x.total_qty||0),0)),"","total across all transfers"],
     ["Last move",items.length?dt(items[0].created_at):"—","",items.length?esc(items[0].transfer_number):"nothing yet"]]
   .map(([l,v,c,sub])=>`<div class="kpi fresh"><div class="l">${l}</div>
    <div class="v num" ${c?`style="color:${c}"`:""}>${v}</div><div class="d">${sub}</div></div>`).join("")}
 </div>
 <div class="card" style="margin-bottom:14px"><div class="cb">
   <div class="ct">Move stock</div>
   <div class="mini" style="margin:4px 0 12px;line-height:1.55">Send pieces from one location to
    another — warehouse to shop floor, or between shops. Your total stock does not change, only
    where it sits, and both sides are written in one go.</div>
   <button class="btn p" onclick="openTransfer()">New transfer</button>
 </div></div>
 <div class="card"><div class="cb" style="padding-bottom:2px">
   <div class="ct">Transfers made</div></div>
  ${items.length?`<div class="tw"><table><thead><tr>
   <th>Transfer</th><th>From</th><th>To</th><th>When</th>
   <th class="r">Lines</th><th class="r">Pieces</th><th>Status</th></tr></thead><tbody>
   ${items.map(x=>`<tr>
    <td><b>${esc(x.transfer_number)}</b></td>
    <td>${esc(x.from_location||"—")}</td>
    <td>${esc(x.to_location||"—")}</td>
    <td class="mini">${dt(x.created_at)}</td>
    <td class="r num">${fmt(x.lines)}</td>
    <td class="r num">${fmt(x.total_qty)}</td>
    <td><span class="pill ${x.status==="completed"?"p-ok":"p-grey"}">${esc(x.status)}</span></td>
   </tr>`).join("")}
  </tbody></table></div>`
  :emptyState("Nothing moved yet","Send stock from the warehouse to the shop floor and it shows up here.")}
 </div>`;
}

async function openTransfer(){
 const locs=(await api("/api/v1/locations")).items||[];
 if(locs.length<2)return toast("You need two locations before you can transfer","bad");
 const from=locs[0];
 const inv=(await api("/api/v1/inventory?location="+encodeURIComponent(from.code))).items||[];
 const stocked=inv.filter(r=>r.on_hand>0).slice(0,60);
 openM("Move stock",
  `${esc(from.name||from.code)} → pick a destination`,
  `<div class="mini" style="padding:10px 12px;background:var(--soft);border-radius:9px;
    line-height:1.55;margin-bottom:12px">You can only send what is actually on the shelf at the
   source. Leave a line at 0 to skip it.</div>
  <div class="f2">
   <div class="field"><label>From</label>
    <select class="inp" id="trFrom" onchange="reloadTransferSource()">
     ${locs.map((l,i)=>`<option value="${l.id}" data-code="${esc(l.code)}" ${i===0?"selected":""}>${esc(l.name||l.code)}</option>`).join("")}
    </select></div>
   <div class="field"><label>To</label>
    <select class="inp" id="trTo">
     ${locs.map((l,i)=>`<option value="${l.id}" ${i===1?"selected":""}>${esc(l.name||l.code)}</option>`).join("")}
    </select></div>
  </div>
  <div id="trBody">${transferLines(stocked)}</div>
  <div class="field" style="margin-top:12px"><label>Notes</label>
   <input class="inp" id="trNote" placeholder="e.g. weekend restock"></div>`,
  `<button class="btn" onclick="closeM()">Cancel</button><span class="spacer"></span>
   <button class="btn p" onclick="doTransfer()">Move it</button>`);
 TRANSFER_ROWS=stocked;
}

let TRANSFER_ROWS=[];
function transferLines(rows){
 if(!rows.length)return `<div class="mini" style="padding:22px 0;text-align:center">
   Nothing on the shelf at this location to move.</div>`;
 return `<div class="tw" style="max-height:320px;overflow:auto"><table><thead><tr>
  <th>Item</th><th class="r">On hand</th><th class="r">Send</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr>
   <td><b>${esc(r.name)}</b><div class="mini">${esc(r.sku)}</div></td>
   <td class="r num">${fmt(r.on_hand)}</td>
   <td class="r"><input class="inp num r" style="width:84px" type="number" min="0"
     max="${r.on_hand}" step="1" id="trq${i}" value="0"></td>
  </tr>`).join("")}
 </tbody></table></div>`;
}

async function reloadTransferSource(){
 const sel=document.getElementById("trFrom");
 const code=sel?.options?.[sel.selectedIndex]?.dataset?.code;
 if(!code)return;
 const inv=(await api("/api/v1/inventory?location="+encodeURIComponent(code))).items||[];
 TRANSFER_ROWS=inv.filter(r=>r.on_hand>0).slice(0,60);
 const body=document.getElementById("trBody");
 if(body)body.innerHTML=transferLines(TRANSFER_ROWS);
}

async function doTransfer(){
 const from=document.getElementById("trFrom")?.value;
 const to=document.getElementById("trTo")?.value;
 if(from===to)return toast("Pick two different locations","bad");
 const lines=TRANSFER_ROWS.map((r,i)=>({product_id:r.product_id,
   quantity:+(document.getElementById("trq"+i)?.value||0)})).filter(l=>l.quantity>0);
 if(!lines.length)return toast("Enter how many pieces to send","bad");
 try{
  const r=await api("/api/v1/inventory/transfers",{method:"POST",body:JSON.stringify({
    from_location_id:from,to_location_id:to,lines,
    notes:document.getElementById("trNote")?.value||""})});
  closeM();
  toast(`${r.transfer_number}: ${fmt(r.total_qty)} pieces moved across ${r.lines} line${r.lines==1?"":"s"}`,"ok");
  CACHE={};renderTransfers();
 }catch(e){toast(e.message,"bad")}
}

const RENDER={dashboard:renderDashboard,billing:renderBilling,invoices:renderInvoices,
 customers:renderCustomers,receivables:renderReceivables,inventory:renderInventory,
 styles:renderStyles,purchase:renderPurchase,reports:renderReports,import:renderImport,
 prices:renderPrices,receiving:renderReceiving,returns:renderReturns,payables:renderPayables,
 stocktakes:renderStocktakes,transfers:renderTransfers,tax:renderTax};

async function boot(keepPage){
 try{
  TENANTS=(await (await fetch(API+"/api/v1/tenants")).json()).items;
  const t=TENANTS.find(x=>x.id===TENANT)||TENANTS[0];TENANT=t.id;
  document.getElementById("tenantSel").innerHTML=TENANTS.map(x=>
   `<option value="${x.id}" ${x.id===TENANT?"selected":""}>${esc(x.name)}</option>`).join("");
  document.getElementById("bizName").textContent=t.name;
  document.getElementById("bizGst").textContent=t.gstin||"";
  buildNav();BILL={lines:[],customer:null,location:null,search:""};PICK={};
  go(keepPage?PAGE:"dashboard");
  const d=CACHE.dash||await api("/api/v1/dashboard");
  document.getElementById("bdg-purchase").innerHTML=d.procurement.critical?`<span class="b">${d.procurement.critical}</span>`:"";
  document.getElementById("bdg-receivables").innerHTML=d.receivables.overdue_count?`<span class="b">${d.receivables.overdue_count}</span>`:"";
 }catch(e){document.getElementById("body").innerHTML=
  `<div class="card"><div class="empty"><h4>Cannot reach the server</h4><p class="mini">${esc(e.message)}<br>Start it with <b>python3 demo/erp_server.py</b></p></div></div>`}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
boot();
</script></body></html>
